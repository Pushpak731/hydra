# This workflow uploads Hydra to PyPI using Trusted Publishers.
#
# This is a release-branch-local copy for the EOL 1.3 branch. It intentionally
# avoids the newer main-branch release tool configuration and builds one
# explicitly selected package from this checkout.
name: Publish to PyPI

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to build and publish"
        required: true
        type: choice
        default: hydra-core
        options:
          - hydra-core
          - hydra-ax-sweeper
          - hydra-colorlog
          - hydra-joblib-launcher
          - hydra-nevergrad-sweeper
          - hydra-optuna-sweeper
          - hydra-ray-launcher
          - hydra-rq-launcher
          - hydra-submitit-launcher
      publish:
        description: "Publish to PyPI after building artifacts"
        required: true
        type: boolean
        default: false

jobs:
  build-artifacts:
    name: Build distribution artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements.txt build read-version twine wheel

      - name: Select package
        id: package
        env:
          PACKAGE: ${{ inputs.package || 'hydra-core' }}
        run: |
          case "${PACKAGE}" in
            hydra-core) package_dir="${GITHUB_WORKSPACE}" ;;
            hydra-ax-sweeper) package_dir="${GITHUB_WORKSPACE}/plugins/hydra_ax_sweeper" ;;
            hydra-colorlog) package_dir="${GITHUB_WORKSPACE}/plugins/hydra_colorlog" ;;
            hydra-joblib-launcher) package_dir="${GITHUB_WORKSPACE}/plugins/hydra_joblib_launcher" ;;
            hydra-nevergrad-sweeper) package_dir="${GITHUB_WORKSPACE}/plugins/hydra_nevergrad_sweeper" ;;
            hydra-optuna-sweeper) package_dir="${GITHUB_WORKSPACE}/plugins/hydra_optuna_sweeper" ;;
            hydra-ray-launcher) package_dir="${GITHUB_WORKSPACE}/plugins/hydra_ray_launcher" ;;
            hydra-rq-launcher) package_dir="${GITHUB_WORKSPACE}/plugins/hydra_rq_launcher" ;;
            hydra-submitit-launcher) package_dir="${GITHUB_WORKSPACE}/plugins/hydra_submitit_launcher" ;;
            *) echo "Unsupported package: ${PACKAGE}" >&2; exit 1 ;;
          esac
          echo "name=${PACKAGE}" >> "${GITHUB_OUTPUT}"
          echo "directory=${package_dir}" >> "${GITHUB_OUTPUT}"

      - name: Build distributions
        run: |
          rm -rf dist
          python -m build \
            --no-isolation \
            --outdir "${GITHUB_WORKSPACE}/dist" \
            "${{ steps.package.outputs.directory }}"

      - name: Verify build artifacts
        run: |
          ls -lah dist/
          twine check dist/*

      - name: Write release summary
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
          PUBLISH_ENABLED: ${{ github.event_name == 'release' || inputs.publish == true }}
          TARGET_REPOSITORY: PyPI
        run: |
          if [[ "${PUBLISH_ENABLED}" == "true" ]]; then
            mode="publish"
            outcome="Artifacts will be uploaded to ${TARGET_REPOSITORY}."
          else
            mode="dry run"
            outcome="Artifacts were built and checked only; no upload will run."
          fi

          {
            echo "## Release summary"
            echo
            echo "- Package: \`${PACKAGE}\`"
            echo "- Target repository: ${TARGET_REPOSITORY}"
            echo "- Mode: ${mode}"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Outcome: ${outcome}"
            echo
            echo "### Artifacts"
            echo
            echo "| Artifact | Size |"
            echo "| --- | ---: |"
            find dist -maxdepth 1 -type f -printf '%f\t%s\n' \
              | sort \
              | while IFS=$'\t' read -r artifact bytes; do
                  size="$(numfmt --to=iec --suffix=B "${bytes}")"
                  echo "| \`${artifact}\` | ${size} |"
                done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 0

  pypi-publish:
    needs: build-artifacts
    name: Upload release to PyPI
    if: ${{ github.event_name == 'release' || inputs.publish == true }}
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
